# Path-of-craft-tree: experience for what a player does, spent on a huge passive tree.
# The tree and all balance numbers are data: data/tree.json, written by the example generator.
[mod]
id = "path_of_craft_tree"
version = "0.4.9"

# The commit that adds native_player_break_block, which the Vein node needs.
[compatibility]
horizon_revision = "7e4e421224743469035ba0c34fc21e569e64a17d"

